name: Release

# A version tag publishes a release; a manual run only leaves the exe as an
# artifact of the run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET: x86_64-pc-windows-msvc
  EXE: target/x86_64-pc-windows-msvc/release/claude-usage-widget.exe

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add $env:TARGET

      - name: Test
        run: cargo test --target $env:TARGET

      - name: Build
        run: cargo build --release --target $env:TARGET
        env:
          # No Visual C++ runtime to install on the machines it runs on.
          RUSTFLAGS: -Ctarget-feature=+crt-static

      - uses: actions/upload-artifact@v7
        with:
          name: claude-usage-widget
          path: ${{ env.EXE }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:EXE --generate-notes
